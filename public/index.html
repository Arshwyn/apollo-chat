<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Apollo</title>
    <meta name="theme-color" content="#f6f5f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14262f" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="bar">
        <button id="back-btn" class="icon-btn" type="button" aria-label="Back to chat" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7" /></svg>
        </button>
        <button id="menu-btn" class="icon-btn" type="button" aria-label="Chats">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 7h16M4 12h16M4 17h10" />
          </svg>
        </button>
        <svg class="mark" viewBox="56 80 400 400" aria-hidden="true" focusable="false">
          <g class="wreath">
            <ellipse cx="317" cy="429.2" rx="30" ry="15" transform="rotate(189.9 317.0 429.2)" />
            <ellipse cx="363.7" cy="403.7" rx="29.1" ry="15" transform="rotate(172.8 363.7 403.7)" />
            <ellipse cx="400.8" cy="365.5" rx="28.3" ry="15" transform="rotate(155.6 400.8 365.5)" />
            <ellipse cx="424.9" cy="318.1" rx="27.4" ry="15" transform="rotate(138.4 424.9 318.1)" />
            <ellipse cx="434" cy="265.7" rx="26.6" ry="15" transform="rotate(121.2 434.0 265.7)" />
            <ellipse cx="427.1" cy="212.9" rx="25.7" ry="15" transform="rotate(104.0 427.1 212.9)" />
            <ellipse cx="405" cy="164.6" rx="24.9" ry="15" transform="rotate(86.8 405.0 164.6)" />
            <ellipse cx="369.5" cy="124.9" rx="24" ry="15" transform="rotate(69.6 369.5 124.9)" />
            <ellipse cx="195" cy="429.2" rx="30" ry="15" transform="rotate(-9.9 195.0 429.2)" />
            <ellipse cx="148.3" cy="403.7" rx="29.1" ry="15" transform="rotate(7.2 148.3 403.7)" />
            <ellipse cx="111.2" cy="365.5" rx="28.3" ry="15" transform="rotate(24.4 111.2 365.5)" />
            <ellipse cx="87.1" cy="318.1" rx="27.4" ry="15" transform="rotate(41.6 87.1 318.1)" />
            <ellipse cx="78" cy="265.7" rx="26.6" ry="15" transform="rotate(58.8 78.0 265.7)" />
            <ellipse cx="84.9" cy="212.9" rx="25.7" ry="15" transform="rotate(76.0 84.9 212.9)" />
            <ellipse cx="107" cy="164.6" rx="24.9" ry="15" transform="rotate(93.2 107.0 164.6)" />
            <ellipse cx="142.5" cy="124.9" rx="24" ry="15" transform="rotate(110.4 142.5 124.9)" />
          </g>
          <path
            class="a"
            fill-rule="evenodd"
            transform="translate(153.7 156) scale(0.29)"
            d="M242 700L0 700L0 652L48 644Q66 640 74.5 630.5Q83 621 94 590L94 590L305 0L411 0L620 591Q630 616 636.5 626Q643 636 664 641L664 641L705 650L705 700L438 700L438 652L496 645Q516 642 520.5 631Q525 620 516 595L516 595L472 469L204 469L162 591Q155 611 157 625.5Q159 640 185 644L185 644L242 653L242 700M338 83L224 412L453 412L342 83L338 83"
          />
        </svg>
        <h1 id="title">Apollo</h1>
        <h1 id="logs-title" hidden>Daily logs</h1>
        <button id="new-btn" class="icon-btn" type="button" aria-label="New chat">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14" /></svg>
        </button>
      </header>
      <div id="offline" hidden>You are offline. Chats load when you reconnect.</div>
      <main id="messages" aria-live="polite"></main>
      <section id="logs" aria-label="Daily logs" hidden></section>
      <div id="status" hidden></div>
      <div id="toast" role="status" aria-live="polite"></div>
      <form id="composer" autocomplete="off">
        <div id="previews"></div>
        <div id="row">
          <button id="attach-btn" class="icon-btn" type="button" aria-label="Attach photos">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M4 8.5A1.5 1.5 0 0 1 5.5 7H8l1.2-2h5.6L16 7h2.5A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"
              />
              <circle cx="12" cy="13" r="3.2" />
            </svg>
          </button>
          <input id="file" type="file" accept="image/*,image/heic,image/heif" multiple hidden />
          <textarea id="input" rows="1" placeholder="Message Apollo" enterkeyhint="send"></textarea>
          <button id="send-btn" type="submit" aria-label="Send">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 19V6M6.5 11.5 12 6l5.5 5.5" />
            </svg>
          </button>
          <button id="cancel-btn" type="button" hidden>Stop</button>
        </div>
      </form>
      <div id="scrim" aria-hidden="true" hidden></div>
      <aside id="drawer" role="dialog" aria-modal="true" aria-label="Chats" hidden>
        <div id="drawer-head">
          <h2>Chats</h2>
          <button id="close-drawer" class="icon-btn" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M6 6l12 12M18 6 6 18" />
            </svg>
          </button>
        </div>
        <ul id="chat-list"></ul>
        <button id="open-logs" type="button">Daily logs</button>
        <button id="copy-chat" type="button">Copy conversation</button>
        <button id="delete-all" type="button">Delete all my chats</button>
      </aside>
    </div>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
