<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Apollo</title>
    <meta name="theme-color" content="#2f6fed" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="bar">
        <button id="menu-btn" type="button" aria-label="Chats">&#9776;</button>
        <h1 id="title">Apollo</h1>
        <button id="new-btn" type="button" aria-label="New chat">+</button>
      </header>
      <div id="offline" hidden>You are offline. Chats load when you reconnect.</div>
      <main id="messages" aria-live="polite"></main>
      <div id="status" hidden></div>
      <div id="toast" role="status" aria-live="polite"></div>
      <form id="composer" autocomplete="off">
        <div id="previews"></div>
        <div id="row">
          <button id="attach-btn" type="button" aria-label="Attach photos">&#128247;</button>
          <input id="file" type="file" accept="image/*" multiple hidden />
          <textarea id="input" rows="1" placeholder="Message Apollo" enterkeyhint="send"></textarea>
          <button id="send-btn" type="submit">Send</button>
          <button id="cancel-btn" type="button" hidden>Stop</button>
        </div>
      </form>
      <aside id="drawer" hidden>
        <div id="drawer-head">
          <strong>Chats</strong>
          <button id="close-drawer" type="button" aria-label="Close">&times;</button>
        </div>
        <ul id="chat-list"></ul>
        <button id="copy-chat" type="button">Copy conversation</button>
        <button id="delete-all" type="button">Delete all my chats</button>
      </aside>
    </div>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
